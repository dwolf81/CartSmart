<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartSmart Price Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="CartSmart" width="24" height="24">
        <h1>CartSmart</h1>
      </div>
      <span class="version" id="version"></span>
    </header>

    <!-- Auth status -->
    <section class="section" id="auth-section">
      <div class="auth-bar" id="auth-bar">
        <span class="auth-text" id="auth-text">Not signed in</span>
        <a href="#" class="auth-link" id="auth-link">Sign in</a>
      </div>
    </section>

    <!-- Current page status -->
    <section class="section" id="current-page">
      <h2>Current Page</h2>
      <div class="status-card" id="page-status">
        <div class="status-indicator" id="status-dot"></div>
        <div class="status-text">
          <span id="status-label">Checking…</span>
          <span class="status-detail" id="status-detail"></span>
        </div>
      </div>
      <button class="btn btn-primary" id="extract-btn" style="display:none; margin-top:8px;">Extract Price Now</button>
      <button class="btn btn-primary" id="add-product-btn" style="display:none; margin-top:8px;">Add Product</button>
      <div id="add-product-result" class="add-product-result" style="display:none; margin-top:8px; font-size:12px; line-height:1.4;"></div>
    </section>

    <!-- Stats -->
    <section class="section">
      <h2>Extension Status</h2>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="store-count">–</span>
          <span class="stat-label">Stores</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="report-count">–</span>
          <span class="stat-label">Reports</span>
        </div>
      </div>
      <button class="btn btn-secondary" id="refresh-btn">Refresh Stores</button>
    </section>

    <!-- Recent reports -->
    <section class="section">
      <h2>Recent Extractions</h2>
      <ul class="report-list" id="report-list">
        <li class="empty">No extractions yet</li>
      </ul>
    </section>

    <footer class="footer">
      <a href="#" id="options-link">Settings</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
